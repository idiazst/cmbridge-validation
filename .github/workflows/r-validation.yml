name: R validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R_KEEP_PKG_SOURCE: yes
      CMBRIDGE_VALIDATION_DIR: validation-artifacts/bridge
      CMBRIDGE_ADJOINT_VALIDATION_DIR: validation-artifacts/adjoint

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
          needs: check

      - name: R CMD check
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran"),
            error_on = "error",
            check_dir = "check"
          )

      - name: Install cmbridge
        run: R CMD INSTALL .

      - name: Run bridge large-sample validation in R
        run: Rscript inst/simulations/validate_large_sample.R

      - name: Run adjoint large-sample validation in R
        run: Rscript inst/simulations/validate_adjoint_large_sample.R

      - name: Show bridge validation results
        if: always()
        run: |
          if [ -f validation-artifacts/bridge/validation_results.csv ]; then
            cat validation-artifacts/bridge/validation_results.csv
          fi

      - name: Show adjoint validation results
        if: always()
        run: |
          if [ -f validation-artifacts/adjoint/adjoint_validation_results.csv ]; then
            cat validation-artifacts/adjoint/adjoint_validation_results.csv
          fi

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmbridge-r-validation
          path: |
            validation-artifacts/
            check/
          if-no-files-found: warn
